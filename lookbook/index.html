    var raw=btoa(String.fromCharCode.apply(null,new Uint8Array(await crypto.subtle.exportKey('raw',k))));
    await open(k,raw);
  }catch(err){m.className='msg err';m.textContent='That password is not right.';b.disabled=false;}
});
